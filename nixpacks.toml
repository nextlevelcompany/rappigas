# Nixpacks build plan for RappiGas (Spring Boot + Next.js)
[phases.setup]
nixPkgs = ["nodejs_20", "jdk21_headless", "maven"]

[phases.install]
cmds = [
  "cd frontend && npm install"
]

[phases.build]
cmds = [
  "cd backend && mvn clean package -DskipTests",
  "cd frontend && npm run build"
]

[start]
cmd = "sh -c 'java -jar backend/target/*.jar & cd frontend && npm start'"
