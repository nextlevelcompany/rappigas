name: rappigas

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rappigas-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pidegas_db}
      POSTGRES_USER: ${POSTGRES_USER:-pidegas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pidegas_secure_password_123!}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pidegas_user} -d ${POSTGRES_DB:-pidegas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - rappigas-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rappigas-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/pidegas_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-pidegas_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-pidegas_secure_password_123!}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-86400000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/var/pidegas/uploads}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY:-mock-payment-key-test}
      GOOGLE_MAPS_SERVER_API_KEY: ${GOOGLE_MAPS_SERVER_API_KEY:-mock-google-maps-server-key}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/var/pidegas/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rappigas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rappigas-frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost/ws}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-mock-google-maps-browser-key}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - rappigas-network

  nginx:
    image: nginx:alpine
    container_name: rappigas-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - rappigas-network

volumes:
  postgres_data:
    name: pidegas_postgres_data
    external: true
  uploads_data:

networks:
  rappigas-network:
    driver: bridge
