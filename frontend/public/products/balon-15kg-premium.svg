<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="100%" height="100%">
  <defs>
    <linearGradient id="balonRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="25%" stop-color="#dc2626" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="80%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <filter id="dropShadow15" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <ellipse cx="150" cy="375" rx="85" ry="15" fill="#cbd5e1" opacity="0.6" />
  <ellipse cx="150" cy="375" rx="65" ry="9" fill="#94a3b8" opacity="0.8" />

  <!-- Base de apoyo -->
  <path d="M 98 348 L 98 365 Q 150 374 202 365 L 202 348 Z" fill="#64748b" />

  <!-- Cuerpo más alto y esbelto de 15kg -->
  <g filter="url(#dropShadow15)">
    <path d="
      M 80 115 
      C 80 75, 220 75, 220 115 
      L 220 335 
      C 220 365, 80 365, 80 335 
      Z" 
      fill="url(#balonRedGrad)" 
    />
  </g>

  <!-- Brillos verticales -->
  <path d="M 108 110 Q 116 230 108 335" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.3" fill="none" />
  <path d="M 122 115 Q 126 230 122 330" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.4" fill="none" />

  <!-- Soldadura central -->
  <ellipse cx="150" cy="225" rx="69" ry="4" fill="none" stroke="#7f1d1d" stroke-width="3" opacity="0.8" />
  <ellipse cx="150" cy="226" rx="69" ry="3" fill="none" stroke="#fca5a5" stroke-width="1.5" opacity="0.5" />

  <!-- Collarín Superior -->
  <path d="M 100 95 C 100 55, 200 55, 200 95 L 198 105 C 198 78, 102 78, 102 105 Z" fill="#cbd5e1" />
  <rect x="112" y="65" width="26" height="9" rx="4.5" fill="#7f1d1d" />
  <rect x="162" y="65" width="26" height="9" rx="4.5" fill="#7f1d1d" />

  <!-- Válvula Click-On -->
  <g transform="translate(150, 75)">
    <rect x="-12" y="-10" width="24" height="14" rx="3" fill="#64748b" />
    <path d="M -14 -20 L 14 -20 L 10 -10 L -10 -10 Z" fill="#0284c7" />
    <rect x="-16" y="-12" width="32" height="7" rx="3" fill="#ea580c" />
    <text x="0" y="-7" font-family="Arial, sans-serif" font-size="4.5" font-weight="900" fill="#ffffff" text-anchor="middle">OSINERGMIN</text>
  </g>

  <!-- Etiqueta Oficial 15kg -->
  <rect x="105" y="150" width="90" height="70" rx="10" fill="#ffffff" opacity="0.96" filter="url(#dropShadow15)" />
  <rect x="108" y="153" width="84" height="64" rx="8" fill="none" stroke="#dc2626" stroke-width="2" />
  <circle cx="150" cy="168" r="8" fill="#dc2626" />
  <path d="M 150 163 C 153 167, 154 170, 150 174 C 146 170, 147 167, 150 163 Z" fill="#ffffff" />
  <text x="150" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#03246b" text-anchor="middle">GLP 15 KG</text>
  <text x="150" y="197" font-family="Arial, sans-serif" font-size="7" font-weight="700" fill="#dc2626" text-anchor="middle">FAMILIAR / RESTAURANTE</text>
  <text x="150" y="208" font-family="Arial, sans-serif" font-size="5.5" font-weight="600" fill="#64748b" text-anchor="middle">ALTO RENDIMIENTO</text>

  <!-- Sello Peso Exacto -->
  <g transform="translate(182, 275)">
    <circle cx="0" cy="0" r="16" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="-2" font-family="Arial, sans-serif" font-size="6" font-weight="900" fill="#ffffff" text-anchor="middle">BALANZA</text>
    <text x="0" y="7" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#ffffff" text-anchor="middle">15.0 kg</text>
  </g>
</svg>
