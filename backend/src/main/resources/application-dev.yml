spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pidegas_db}
    username: ${SPRING_DATASOURCE_USERNAME:pidegas_user}
    password: ${SPRING_DATASOURCE_PASSWORD:pidegas_secure_password_123!}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    encoding: UTF-8

logging:
  level:
    com.pidegas: DEBUG
    org.springframework.security: INFO
